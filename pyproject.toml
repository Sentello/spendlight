[project]
name = "spendlight"
version = "1.0.0"
description = "An interactive dashboard for My Expenses CSV exports — no dependencies."
readme = "README.md"
# 3.8 is the floor: statistics.fmean (3.8), ThreadingHTTPServer and
# SimpleHTTPRequestHandler(directory=...) (both 3.7). The syntax itself is
# 3.7-compatible.
requires-python = ">=3.8"
dependencies = []
keywords = ["expenses", "budget", "myexpenses", "dashboard", "csv", "finance"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Accounting",
]

# Metadata only — Spendlight is deliberately not installable as a package.
# It runs from its own folder, because spendlight.py writes data.js next to
# the index.html and script.js it belongs to. Installed into site-packages it
# would be separated from them. Clone the repo and run it in place:
#
#     python3 spendlight.py --serve
